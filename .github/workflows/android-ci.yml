name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "src/components/MusicPlayer/media/androidAudioElement.mjs"
      - "src/components/MusicPlayer/media/nativeMediaDeck.mjs"
      - "src/components/MusicPlayer/media/resolveMediaAsset.mjs"
      - "src/utils/mediaService.mjs"
      - "src/utils/youtubeIframeApi.mjs"
      - "src/components/MusicPlayer/YouTubePlayer.jsx"
      - "src/components/Layout/AppShell.jsx"
      - "src/utils/androidNavigation.mjs"
      - "docs/qa/android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-play-store.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/components/MusicPlayer/media/androidAudioElement.mjs"
      - "src/components/MusicPlayer/media/nativeMediaDeck.mjs"
      - "src/components/MusicPlayer/media/resolveMediaAsset.mjs"
      - "src/utils/mediaService.mjs"
      - "src/utils/youtubeIframeApi.mjs"
      - "src/components/MusicPlayer/YouTubePlayer.jsx"
      - "src/components/Layout/AppShell.jsx"
      - "src/utils/androidNavigation.mjs"
      - "docs/qa/android/**"
      - ".github/workflows/android-ci.yml"
      - ".github/workflows/android-play-store.yml"

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check web audio bridge
        run: |
          node docs/qa/android/check.mjs
          node docs/qa/android/resolve-check.cjs
          node docs/qa/android/release-check.mjs
          node docs/qa/android/iframe-api-check.mjs
          node docs/qa/android/live-probe-check.mjs
          node docs/qa/android/native-layout-check.mjs
      - name: Build and check Android app
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug testReleaseUnitTest lintRelease bundleRelease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: haykasa-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload unsigned release bundle for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: haykasa-android-unsigned-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: haykasa-android-checks-${{ github.sha }}
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    name: Android ${{ matrix.api-level }} emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [33, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools"
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate native bridge fixture from production code
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          node docs/qa/android/create-fixture.cjs
      - name: Build current web UI for isolated emulator verification
        run: npm run build
        env:
          DISABLE_PWA: "1"
          NEXTAUTH_URL: https://haykasa.vercel.app
          NEXTAUTH_SECRET: isolated-emulator-guest-session
          JWT_SECRET: isolated-emulator-guest-session
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Run APK instrumentation on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash docs/qa/android/run-emulator.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-emulator-api-${{ matrix.api-level }}-${{ github.sha }}
          path: |
            artifacts/android-emulator/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
