name: Security Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Web and native security regression cases
        run: node docs/qa/security-audit/run.cjs /tmp/heykasa-web-regressions.json --verify-fixes
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned media service runtime and test transport
        run: python3 -m pip install -r media-service/requirements.vercel.txt
      - name: Media service security regression cases
        run: python3 docs/qa/security-audit/run_media.py /tmp/heykasa-media-regressions.json --verify-fixes

      - name: Stateless Vercel media regression cases
        run: python3 docs/qa/vercel-media/check.py

      - name: Verify automatic source selection and packet-identical audio remux
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 docs/qa/audio-quality/check.py

      - name: Build Vercel container and verify runtime startup
        run: |
          docker build -f media-service/Dockerfile.vercel -t haykasa-vercel-media media-service
          docker run -d --name haykasa-vercel-media -p 127.0.0.1:8090:8000 -e JWT_SECRET=isolated-container-secret-00000000000000000000 -e BLOB_READ_WRITE_TOKEN=isolated-storage-token haykasa-vercel-media
          trap 'docker logs haykasa-vercel-media; docker rm -f haykasa-vercel-media' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8090/media-health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8090/media-health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --request POST http://127.0.0.1:8090/v1/jobs)" = 401
