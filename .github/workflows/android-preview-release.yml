name: Publish Android Preview

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Android APK workflow run for a source commit merged into main
        required: true
        type: string
  workflow_run:
    workflows: [Android APK]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-preview-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == '6NCLegend9/Spotify-clone' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Publish verified preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_PREVIEW_RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
        run: node scripts/publish-android-preview.mjs
