name: Homepage Discovery VM
on:
  pull_request:
    paths:
      - 'src/components/Homepage/**'
      - 'src/components/Search/**'
      - 'src/components/Searchbar.jsx'
      - 'src/components/Navbar.jsx'
      - 'src/components/DesktopAppCard.jsx'
      - 'src/components/DesktopUpdateNotifier.jsx'
      - 'src/utils/desktopEnvironment.js'
      - 'scripts/check-desktop-update-ui.cjs'
      - 'package.json'
      - 'package-lock.json'
      - 'src/components/AndroidAppCard.jsx'
      - 'src/app/AuthProvider.js'
      - 'src/utils/youtubeIframeApi.mjs'
      - 'src/utils/youtubePlaybackError.mjs'
      - 'src/components/SupportDiagnostics.jsx'
      - 'src/components/AddToPlaylistButton.jsx'
      - 'src/components/TrackQueueMenu.jsx'
      - 'src/components/AccountPrivacyBoundary.jsx'
      - 'src/hooks/useAccountScope.js'
      - 'src/hooks/usePlaybackRequest.js'
      - 'src/components/RecommendationPlaylistCard.jsx'
      - 'src/components/ArtistProfile.jsx'
      - 'src/components/ArtistCatalogRails.jsx'
      - 'src/utils/accountStorage.mjs'
      - 'src/utils/playlistAccess.mjs'
      - 'scripts/check-playlist-menu-browser.cjs'
      - 'src/components/FeedbackPreferences.jsx'
      - 'src/components/ListeningInsights.jsx'
      - 'src/components/GenrePreferences.jsx'
      - 'src/components/UpdatesBell.jsx'
      - 'src/app/settings/page.jsx'
      - 'src/components/PlaylistCover.jsx'
      - 'src/components/PullToRefresh.jsx'
      - 'src/components/LanguageSync.jsx'
      - 'src/hooks/useCrowdRadio.js'
      - 'src/redux/features/playerSlice.js'
      - 'src/utils/playbackSnapshot.mjs'
      - 'src/utils/playerQueue.mjs'
      - 'scripts/check-crowd-player.cjs'
      - 'scripts/check-settings-privacy-browser.cjs'
      - 'scripts/check-settings-scope-browser.cjs'
      - 'scripts/check-notification-privacy-browser.cjs'
      - 'scripts/check-playlist-adjacent-browser.cjs'
      - 'src/components/YouTubeMusicResults.jsx'
      - 'src/app/search/**'
      - 'src/utils/searchResults.mjs'
      - 'src/components/Sidebar/**'
      - 'src/components/Layout/**'
      - 'src/components/MusicPlayer/**'
      - 'src/hooks/useHomeFeed.js'
      - 'src/hooks/useInstalledApp.js'
      - 'src/hooks/useHomeHighlights.js'
      - 'src/utils/thisDayOnKasa.mjs'
      - 'src/utils/homeDiscovery.mjs'
      - 'src/utils/recommendationSeeds.mjs'
      - 'src/app/api/recommendations/**'
      - 'docs/qa/home-discovery/**'
      - 'docs/qa/desktop-panels/**'
      - 'docs/qa/search/**'
      - 'docs/qa/android/player-browser.cjs'
      - 'docs/qa/android/auth-session-browser.cjs'
      - 'docs/qa/android/iframe-api-browser.cjs'
      - 'docs/qa/android-installation/**'
      - '.github/workflows/home-discovery-vm.yml'
permissions:
  contents: read
concurrency:
  group: home-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  homepage-browser:
    # Playwright 1.56.1 has no Ubuntu 26.04 browser build.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node docs/qa/home-discovery/check.cjs /tmp/haykasa-home-fixtures.json
      - run: npm run build
      - run: node docs/qa/home-discovery/browser.cjs /tmp/haykasa-home-fixtures.json
        env:
          HAYKASA_QA_PRODUCTION: '1'
      - run: node docs/qa/desktop-panels/browser.cjs
      - run: node docs/qa/search/browser.cjs
      - run: node docs/qa/android/player-browser.cjs
      - run: node docs/qa/android/auth-session-browser.cjs
      - run: node docs/qa/android/iframe-api-browser.cjs
      - run: node docs/qa/android-installation/browser.cjs
      - name: Verify playlist account privacy and real keyboard interactions
        run: node scripts/check-playlist-menu-browser.cjs
      - name: Verify repeated queue occurrences and Crowd station advancement
        run: node scripts/check-crowd-player.cjs
      - name: Verify Settings panels across account and privacy-generation changes
        run: node scripts/check-settings-privacy-browser.cjs
      - name: Verify genre, notification and language account isolation
        run: node scripts/check-settings-scope-browser.cjs
      - name: Verify current notification preferences and delayed permission isolation
        run: node scripts/check-notification-privacy-browser.cjs
      - name: Verify cover fallback and cancelled pull gestures
        run: node scripts/check-playlist-adjacent-browser.cjs
      - name: Verify desktop updater status ordering and Restart recovery
        run: node scripts/check-desktop-update-ui.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: homepage-discovery-results
          path: |
            artifacts/home-discovery/
            artifacts/desktop-panels/
            artifacts/search/
            artifacts/android-player-browser/
            artifacts/android-installation/
            artifacts/auth-session/
            artifacts/android-iframe-api/
            artifacts/playlist-menu/
            artifacts/crowd-player/
            artifacts/settings-privacy/
            artifacts/settings-scope/
            artifacts/notification-privacy/
            artifacts/playlist-adjacent/
            artifacts/desktop-update-ui/
          retention-days: 7
