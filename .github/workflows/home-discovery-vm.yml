name: Homepage Discovery VM
on:
  pull_request:
    paths:
      - 'src/components/Homepage/**'
      - 'src/components/Search/**'
      - 'src/components/Searchbar.jsx'
      - 'src/components/AndroidAppCard.jsx'
      - 'src/components/SupportDiagnostics.jsx'
      - 'src/components/YouTubeMusicResults.jsx'
      - 'src/app/search/**'
      - 'src/utils/searchResults.mjs'
      - 'src/components/Sidebar/**'
      - 'src/components/Layout/**'
      - 'src/components/MusicPlayer/**'
      - 'src/hooks/useHomeFeed.js'
      - 'src/hooks/useHomeHighlights.js'
      - 'src/utils/thisDayOnKasa.mjs'
      - 'src/utils/homeDiscovery.mjs'
      - 'src/utils/recommendationSeeds.mjs'
      - 'src/app/api/recommendations/**'
      - 'docs/qa/home-discovery/**'
      - 'docs/qa/desktop-panels/**'
      - 'docs/qa/search/**'
      - 'docs/qa/android/player-browser.cjs'
      - 'docs/qa/android-installation/**'
      - '.github/workflows/home-discovery-vm.yml'
permissions:
  contents: read
concurrency:
  group: home-discovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  homepage-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node docs/qa/home-discovery/check.cjs /tmp/haykasa-home-fixtures.json
      - run: npm run build
      - run: node docs/qa/home-discovery/browser.cjs /tmp/haykasa-home-fixtures.json
        env:
          HAYKASA_QA_PRODUCTION: '1'
      - run: node docs/qa/desktop-panels/browser.cjs
      - run: node docs/qa/search/browser.cjs
      - run: node docs/qa/android/player-browser.cjs
      - run: node docs/qa/android-installation/browser.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: homepage-discovery-results
          path: |
            artifacts/home-discovery/
            artifacts/desktop-panels/
            artifacts/search/
            artifacts/android-player-browser/
            artifacts/android-installation/
          retention-days: 7
