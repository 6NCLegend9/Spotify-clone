name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      # Test-only values for the local production server started by Playwright.
      # Production deployment secrets remain managed by Vercel.
      NEXTAUTH_SECRET: heykasa-ci-browser-regression-only-secret
      NEXTAUTH_URL: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run check
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - run: npm run benchmark:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-${{ github.sha }}
          path: artifacts/performance.json
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
