name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Test-only values for the local production servers used by CI.
  # Production deployment secrets remain managed by Vercel.
  NEXTAUTH_SECRET: heykasa-ci-browser-regression-only-secret
  NEXTAUTH_URL: http://localhost:3100
  DISABLE_HTTPS_UPGRADE: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: npm run check

  e2e:
    name: e2e / ${{ matrix.project }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: mobile-chrome
            browser: chromium
          - project: mobile-safari
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project="${{ matrix.project }}" --workers=2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: browser-test-results-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  benchmark:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run benchmark:production
      - name: Enforce performance budget
        shell: bash
        run: |
          if node scripts/performance-budget.mjs; then
            exit 0
          fi
          cp artifacts/performance.json artifacts/performance-initial-failure.json
          echo "Initial performance budget failed; confirming with a fresh benchmark batch"
          npm run benchmark:production
          node scripts/performance-budget.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: performance-${{ github.sha }}
          path: |
            artifacts/performance.json
            artifacts/performance-initial-failure.json
          retention-days: 14
