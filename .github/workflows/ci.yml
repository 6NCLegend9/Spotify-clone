name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: node docs/qa/pr28-playlists/check.cjs
      - run: node docs/qa/background-playback/check.cjs
      - run: node docs/qa/mobile-source-playback/check.cjs
      - run: node docs/qa/vercel-media/config-check.cjs
      - run: node docs/qa/playlist-duration/check.cjs
      - run: node docs/qa/home-discovery/check.cjs
      - run: node docs/qa/integration-conflicts/check.cjs
      - run: npm run check
