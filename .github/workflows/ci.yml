name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run audit:production
      - run: node docs/qa/pr28-playlists/check.cjs
      - run: node docs/qa/background-playback/check.cjs
      - run: node docs/qa/mobile-source-playback/check.cjs
      - run: node docs/qa/vercel-media/config-check.cjs
      - run: node docs/qa/playlist-duration/check.cjs
      - run: node docs/qa/home-discovery/check.cjs
      - run: node docs/qa/integration-conflicts/check.cjs
      - name: Verify persistent Jam queue occurrences
        run: node --test scripts/check-jam-persistence.mjs
      - run: npm run check

  backend-database-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo@sha256:8bb4442761a63a8dda452744082cdac9644b429807eb977b42324a63cef59ca4
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      HAYKASA_TEST_MONGO_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify authentication, notification races and explicit Jam index migration on local MongoDB
        run: node --test scripts/check-desktop-auth-grants.mjs scripts/check-notification-reads.mjs scripts/check-jam-room-index.mjs

  desktop-discord-ipc:
    name: Desktop IPC and policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
      - name: Verify real IPC cancellation, clear and reconnect behavior
        run: node --test desktop/scripts/check-discord-ipc.mjs
      - name: Verify bounded desktop policy startup and disposal
        run: node --test desktop/scripts/check-policy-deadline.mjs
