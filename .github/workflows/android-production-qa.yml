name: Android Production QA
on:
  workflow_dispatch:
    inputs:
      live_only:
        description: "Focus the public APK retry on playback after the UI tour"
        type: boolean
        default: false
  push:
    branches: [fix/android-installation-guidance]
    paths:
      - docs/qa/android/production-smoke.cjs
      - docs/qa/android/run-production-smoke.sh
      - .github/workflows/android-production-qa.yml
permissions:
  contents: read
concurrency:
  group: android-production-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
      - name: Enable emulator hardware acceleration
        run: sudo chmod a+rw /dev/kvm
      - name: Test the byte-identical public APK against main production
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          GH_TOKEN: ${{ github.token }}
          HAYKASA_PRODUCTION_QA_LIVE_ONLY: ${{ inputs.live_only && '1' || '0' }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash docs/qa/android/run-production-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-production-${{ github.sha }}
          path: artifacts/production-android/
          if-no-files-found: error
          retention-days: 14
