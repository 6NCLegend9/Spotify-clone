name: Desktop Preview

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "public/icon-256x256.png"
      - ".github/workflows/desktop-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-preview
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build public Windows preview
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Test native boundary
        run: npm test

      - name: Build unsigned Windows installer
        run: npm run dist

      - name: Publish preview installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'HayKasa-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw "HayKasa Windows installer was not produced" }

          $tag = "desktop-preview"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "HayKasa Desktop Preview" --notes "Automated Windows preview build from main. This fallback build is not code-signed, so Windows may show a publisher warning." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Could not create desktop preview release" }
          }

          gh release upload $tag $installer.FullName --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not upload desktop preview installer" }

      - uses: actions/upload-artifact@v4
        with:
          name: haykasa-desktop-preview
          path: desktop/dist/HayKasa-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
