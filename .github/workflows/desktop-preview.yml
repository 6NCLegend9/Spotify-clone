name: Desktop Preview

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "public/icon-256x256.png"
      - ".github/workflows/desktop-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build Windows preview
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      HEYKASA_DESKTOP_RELEASE_CHANNEL: internal
      HEYKASA_DESKTOP_MINIMUM_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Test native boundary
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Stamp preview version
        shell: pwsh
        run: npm version "1.1.${{ github.run_number }}-internal" --no-git-tag-version
      - name: Build unsigned Windows installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: haykasa-desktop-preview-${{ github.sha }}
          path: |
            desktop/dist/HayKasa-Setup-*-x64.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14

