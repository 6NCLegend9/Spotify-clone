name: Desktop Preview

on:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "public/icon-256x256.png"
      - ".github/workflows/desktop-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-preview
  cancel-in-progress: true

jobs:
  build-preview:
    name: Build public Windows preview
    runs-on: windows-latest
    timeout-minutes: 35
    environment: desktop-release
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET: ${{ secrets.HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET }}
      HEYKASA_DESKTOP_RELEASE_CHANNEL: internal
      HEYKASA_DESKTOP_MINIMUM_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Validate preview publishing secrets
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BLOB_READ_WRITE_TOKEN)) { throw "BLOB_READ_WRITE_TOKEN is required" }
          if ([string]::IsNullOrWhiteSpace($env:HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET)) { throw "HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET is required" }
          if ($env:HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET.Length -lt 32) { throw "Manifest HMAC secret must be at least 32 characters" }

      - name: Stamp preview version
        shell: pwsh
        run: npm version "1.0.0-preview.${{ github.run_number }}" --no-git-tag-version

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Test native boundary
        run: npm test

      - name: Build unsigned Windows installer
        run: npm run dist

      - name: Publish public preview to Vercel Blob
        run: npm run publish-release

      - uses: actions/upload-artifact@v4
        with:
          name: haykasa-desktop-preview
          path: desktop/dist/HayKasa-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
