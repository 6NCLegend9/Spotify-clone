name: YouTube Provider Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "src/components/MusicPlayer/**"
      - "src/hooks/useYoutubeCaptions.js"
      - "src/app/globals.css"
      - "next.config.js"
      - "e2e/youtube-provider.spec.js"
      - "src/utils/youtubeProviderFailure.mjs"
      - "test/youtubeProviderSmokeContract.test.mjs"
      - ".github/workflows/youtube-provider-smoke.yml"

permissions:
  contents: read

concurrency:
  group: youtube-provider-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTAUTH_SECRET: heykasa-provider-smoke-only-secret
  NEXTAUTH_URL: http://localhost:3100
  DISABLE_HTTPS_UPGRADE: "1"
  HEYKASA_REAL_YOUTUBE_E2E: "1"

jobs:
  real-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Playwright spec skips only failures with explicit external-provider
    # evidence. HayKasa integration regressions remain blocking.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real YouTube iframe integration
        id: provider
        run: npx playwright test e2e/youtube-provider.spec.js --project=chromium-desktop --workers=1
      - name: Report provider verification state
        if: always()
        shell: bash
        env:
          PROVIDER_STEP_OUTCOME: ${{ steps.provider.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, appendFile } from "node:fs/promises";

          const file = "test-results/youtube-provider-status.json";
          let result = null;
          try {
            result = JSON.parse(await readFile(file, "utf8"));
          } catch {
            result = { status: "missing" };
          }

          const status = String(result?.status || "missing");
          const summary = [
            "### YouTube provider verification",
            `- State: **${status}**`,
            `- Test step: **${process.env.PROVIDER_STEP_OUTCOME || "unknown"}**`,
          ];
          if (result?.providerApiLoaded !== undefined) {
            summary.push(`- Provider API loaded: **${result.providerApiLoaded === true ? "yes" : "no"}**`);
          }
          if (Array.isArray(result?.playerErrorCodes) && result.playerErrorCodes.length) {
            summary.push(`- Provider error codes: ${result.playerErrorCodes.join(", ")}`);
          }
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `${summary.join("\n")}\n`);

          if (status === "inconclusive") {
            console.log("::warning title=YouTube playback verification inconclusive::The real provider API loaded, but YouTube blocked all playback candidates from the CI runner. This is not counted as verified playback.");
            process.exit(0);
          }
          if (status === "verified") process.exit(0);

          if (process.env.PROVIDER_STEP_OUTCOME === "success") {
            console.error(`Provider test completed without a terminal verification state: ${status}`);
            process.exit(1);
          }
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: youtube-provider-smoke-${{ github.sha }}
          path: test-results/
          retention-days: 7
