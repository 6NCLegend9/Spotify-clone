name: YouTube Provider Smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "src/components/MusicPlayer/**"
      - "src/hooks/useYoutubeCaptions.js"
      - "src/app/globals.css"
      - "e2e/youtube-provider.spec.js"
      - ".github/workflows/youtube-provider-smoke.yml"

permissions:
  contents: read

concurrency:
  group: youtube-provider-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTAUTH_SECRET: heykasa-provider-smoke-only-secret
  NEXTAUTH_URL: http://localhost:3100
  DISABLE_HTTPS_UPGRADE: "1"
  HEYKASA_REAL_YOUTUBE_E2E: "1"

jobs:
  real-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # YouTube is an external provider. Surface regressions, but do not make a
    # provider outage or regional embed restriction block an otherwise healthy PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify real YouTube iframe integration
        run: npx playwright test e2e/youtube-provider.spec.js --project=chromium-desktop --workers=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: youtube-provider-smoke-${{ github.sha }}
          path: test-results/
          retention-days: 7
