name: Playlist Layout and Duration VM
on:
  pull_request:
    paths:
      - 'src/components/Library/**'
      - 'src/components/TrackQueueMenu.jsx'
      - 'src/services/libraryApi.js'
      - 'src/utils/playlistDuration.mjs'
      - 'src/app/globals.css'
      - 'docs/qa/playlist-duration/**'
      - '.github/workflows/playlist-duration-vm.yml'
permissions:
  contents: read
jobs:
  playlist-browser:
    # Match the supported OS used by the other Playwright 1.56.1 jobs.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node docs/qa/playlist-duration/check.cjs
      - run: node docs/qa/playlist-duration/browser.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playlist-layout-duration-results
          path: artifacts/playlist-duration/
          retention-days: 7
