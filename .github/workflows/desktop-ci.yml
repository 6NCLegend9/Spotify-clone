name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "contracts/**"
      - "scripts/generate-desktop-contract.mjs"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "contracts/**"
      - "scripts/generate-desktop-contract.mjs"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund
      - name: Validate canonical desktop contract
        run: npm run check:desktop-contract
      - name: Check native JavaScript syntax
        shell: bash
        run: find desktop/src desktop/scripts -name '*.mjs' -print0 | xargs -0 -n 1 node --check
      - name: Audit runtime dependencies
        run: npm --prefix desktop audit --omit=dev --audit-level=high
