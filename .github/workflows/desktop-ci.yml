name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "contracts/**"
      - "scripts/desktop-dev*.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "desktop/src/**"
      - "desktop/scripts/smoke-renderer.mjs"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "test/**"
      - "e2e/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "contracts/**"
      - "scripts/desktop-dev*.mjs"
      - "package.json"
      - "package-lock.json"
      - "next.config.js"
      - "desktop/src/**"
      - "desktop/scripts/smoke-renderer.mjs"
      - "desktop/package.json"
      - "desktop/package-lock.json"
      - "test/**"
      - "e2e/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXTAUTH_SECRET: heykasa-desktop-ci-only-secret
  NEXTAUTH_URL: http://127.0.0.1:3003
  DISABLE_HTTPS_UPGRADE: "1"

jobs:
  shared-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund
      - name: Validate canonical desktop contract
        run: npm run check:desktop-contract
      - name: Test desktop web contract
        run: node --test test/desktopAuth.test.mjs test/desktopContract.test.mjs test/desktopDev.test.mjs test/desktopDownload.test.mjs test/desktopInstaller.test.mjs test/desktopManifest.test.mjs test/desktopPolicy.test.mjs test/desktopRelease.test.mjs test/desktopSmokeContract.test.mjs
      - name: Test native boundary
        run: npm --prefix desktop test
      - name: Build shared production renderer
        run: npm run build
      - name: Install Electron runtime dependencies
        run: npx playwright install-deps chromium
      - name: Start shared production renderer
        shell: bash
        run: |
          npm start -- --hostname 127.0.0.1 --port 3003 > /tmp/heykasa-next.log 2>&1 &
          echo $! > /tmp/heykasa-next.pid
      - name: Wait for shared renderer
        run: node --input-type=module -e "import { waitForHttp } from './scripts/desktop-dev-lib.mjs'; await waitForHttp('http://127.0.0.1:3003/search');"
      - name: Verify shared renderer inside Electron
        env:
          HEYKASA_DESKTOP_SMOKE_URL: http://127.0.0.1:3003
        run: xvfb-run -a npm --prefix desktop run smoke:renderer
      - name: Show renderer log on failure
        if: failure()
        run: cat /tmp/heykasa-next.log || true
      - name: Stop shared renderer
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/heykasa-next.pid ]; then
            kill "$(cat /tmp/heykasa-next.pid)" 2>/dev/null || true
          fi
