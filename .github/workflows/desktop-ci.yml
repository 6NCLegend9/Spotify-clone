name: Desktop CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "src/app/api/desktop/**"
      - "src/app/api/version/**"
      - "src/app/layout.js"
      - "src/app/login/page.jsx"
      - "src/app/signup/page.jsx"
      - "src/components/DesktopAppCard.jsx"
      - "src/components/DesktopCompatibilityGate.jsx"
      - "src/components/DesktopUpdateNotifier.jsx"
      - "src/components/DiscordPresenceSync.jsx"
      - "src/components/SupportDiagnostics.jsx"
      - "src/components/WebUpdateNotifier.jsx"
      - "src/hooks/useDiscordPresence.js"
      - "src/lib/discordPresenceClient.js"
      - "src/models/DesktopAuthGrant.js"
      - "src/utils/desktopAuth.mjs"
      - "src/utils/desktopEnvironment.js"
      - "src/utils/desktopInstaller.mjs"
      - "src/utils/desktopRelease.mjs"
      - "test/desktopAuth.test.mjs"
      - "test/desktopInstaller.test.mjs"
      - "test/desktopManifest.test.mjs"
      - "test/desktopPolicy.test.mjs"
      - "test/desktopRelease.test.mjs"
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/desktop-preview.yml"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/app/api/desktop/**"
      - "src/app/api/version/**"
      - "src/app/layout.js"
      - "src/app/login/page.jsx"
      - "src/app/signup/page.jsx"
      - "src/components/DesktopAppCard.jsx"
      - "src/components/DesktopCompatibilityGate.jsx"
      - "src/components/DesktopUpdateNotifier.jsx"
      - "src/components/DiscordPresenceSync.jsx"
      - "src/components/SupportDiagnostics.jsx"
      - "src/components/WebUpdateNotifier.jsx"
      - "src/hooks/useDiscordPresence.js"
      - "src/lib/discordPresenceClient.js"
      - "src/models/DesktopAuthGrant.js"
      - "src/utils/desktopAuth.mjs"
      - "src/utils/desktopEnvironment.js"
      - "src/utils/desktopInstaller.mjs"
      - "src/utils/desktopRelease.mjs"
      - "test/desktopAuth.test.mjs"
      - "test/desktopInstaller.test.mjs"
      - "test/desktopManifest.test.mjs"
      - "test/desktopPolicy.test.mjs"
      - "test/desktopRelease.test.mjs"
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/desktop-preview.yml"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Test desktop web contract
        run: node --test test/desktopAuth.test.mjs test/desktopInstaller.test.mjs test/desktopManifest.test.mjs test/desktopPolicy.test.mjs test/desktopRelease.test.mjs

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Test native boundary
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Stamp main-channel update version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - name: Build unsigned Windows installer
        run: npm run dist
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "HayKasa-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "HayKasa-Setup installer was not produced" }
          $exe = Get-ChildItem -Path dist -Recurse -Filter "HayKasa.exe" | Select-Object -First 1
          if (-not $exe) { throw "HayKasa.exe was not produced" }
          Write-Host "Installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
      - name: Prepare GitHub update bundle
        env:
          HEYKASA_DESKTOP_RELEASE_CHANNEL: stable
          HEYKASA_DESKTOP_MINIMUM_VERSION: "1.0.0"
        run: npm run prepare-github-release
      - uses: actions/upload-artifact@v4
        with:
          name: heykasa-desktop-windows-${{ github.sha }}
          path: |
            desktop/dist/HayKasa-Setup-*-x64.exe
            desktop/dist/HayKasa-Setup-x64.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
            desktop/dist/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  publish-installer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heykasa-desktop-windows-${{ github.sha }}
          path: installer
      - name: Publish GitHub updater fallback
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: HayKasa Desktop Development Channel
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            installer/HayKasa-Setup-*-x64.exe
            installer/HayKasa-Setup-x64.exe
            installer/latest.yml
            installer/*.blockmap
            installer/release-manifest.json
      - name: Verify GitHub updater fallback
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/desktop-latest"
          for file in release-manifest.json latest.yml HayKasa-Setup-x64.exe; do
            curl --fail --location --retry 8 --retry-delay 2 --retry-all-errors --silent --show-error -o /dev/null "$base/$file"
          done
