name: Desktop CI

on:
  push:
    paths:
      - "desktop/**"
      - "src/app/api/desktop/**"
      - "src/app/api/version/**"
      - "src/app/layout.js"
      - "src/app/login/page.jsx"
      - "src/app/signup/page.jsx"
      - "src/components/DesktopAppCard.jsx"
      - "src/components/DesktopCompatibilityGate.jsx"
      - "src/components/DesktopUpdateNotifier.jsx"
      - "src/components/DiscordPresenceSync.jsx"
      - "src/components/SupportDiagnostics.jsx"
      - "src/components/WebUpdateNotifier.jsx"
      - "src/hooks/useDiscordPresence.js"
      - "src/lib/discordPresenceClient.js"
      - "src/models/DesktopAuthGrant.js"
      - "src/utils/desktopAuth.mjs"
      - "src/utils/desktopEnvironment.js"
      - "src/utils/desktopInstaller.mjs"
      - "test/desktopAuth.test.mjs"
      - "test/desktopInstaller.test.mjs"
      - "test/desktopManifest.test.mjs"
      - "test/desktopPolicy.test.mjs"
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "src/app/api/desktop/**"
      - "src/app/api/version/**"
      - "src/app/layout.js"
      - "src/app/login/page.jsx"
      - "src/app/signup/page.jsx"
      - "src/components/DesktopAppCard.jsx"
      - "src/components/DesktopCompatibilityGate.jsx"
      - "src/components/DesktopUpdateNotifier.jsx"
      - "src/components/DiscordPresenceSync.jsx"
      - "src/components/SupportDiagnostics.jsx"
      - "src/components/WebUpdateNotifier.jsx"
      - "src/hooks/useDiscordPresence.js"
      - "src/lib/discordPresenceClient.js"
      - "src/models/DesktopAuthGrant.js"
      - "src/utils/desktopAuth.mjs"
      - "src/utils/desktopEnvironment.js"
      - "src/utils/desktopInstaller.mjs"
      - "test/desktopAuth.test.mjs"
      - "test/desktopInstaller.test.mjs"
      - "test/desktopManifest.test.mjs"
      - "test/desktopPolicy.test.mjs"
      - ".github/workflows/desktop-ci.yml"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Test desktop web contract
        run: node --test test/desktopAuth.test.mjs test/desktopInstaller.test.mjs test/desktopManifest.test.mjs test/desktopPolicy.test.mjs

  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Test native boundary
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build unsigned Windows installer
        run: npm run dist
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter "HayKasa-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "HayKasa-Setup installer was not produced" }
          Copy-Item $installer.FullName (Join-Path $installer.DirectoryName "HayKasa-Setup-x64.exe")
          $exe = Get-ChildItem -Path dist -Recurse -Filter "HayKasa.exe" | Select-Object -First 1
          if (-not $exe) { throw "HayKasa.exe was not produced" }
          Write-Host "Installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
      - name: Publish installer to Vercel Blob
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BLOB_READ_WRITE_TOKEN)) {
            Write-Host "Skipping Vercel Blob publish; BLOB_READ_WRITE_TOKEN is not configured."
            exit 0
          }
          npm run publish-installer
      - uses: actions/upload-artifact@v4
        with:
          name: heykasa-desktop-windows-${{ github.sha }}
          path: desktop/dist/HayKasa-Setup-x64.exe
          if-no-files-found: error
          retention-days: 7

  publish-installer:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: windows-desktop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heykasa-desktop-windows-${{ github.sha }}
          path: installer
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: HayKasa Desktop for Windows
          prerelease: true
          files: installer/HayKasa-Setup-x64.exe
