name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        default: internal
        options:
          - internal
          - beta
          - stable
      version:
        description: Desktop version to publish; must be newer than the installed version
        required: true
        default: "1.1.0"
        type: string
      minimum_version:
        description: Minimum supported desktop version
        required: true
        default: "1.0.0"
        type: string
      release_notes_url:
        description: Optional HTTPS release notes URL
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.channel }}
  cancel-in-progress: false

env:
  NEXTAUTH_SECRET: heykasa-desktop-release-ci-only-secret
  NEXTAUTH_URL: http://localhost:3100
  DISABLE_HTTPS_UPGRADE: "1"

jobs:
  web-gate:
    name: Verify web/native contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Protect stable channel
        shell: bash
        run: |
          if [ "${{ inputs.channel }}" = "stable" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "Stable desktop releases must run from main. Current ref: ${{ github.ref_name }}" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: Validate canonical desktop contract
        run: npm run check:desktop-contract
      - name: Audit web runtime dependencies
        run: npm run audit:production
      - name: Test desktop server contract
        run: node --test test/desktopAuth.test.mjs test/desktopDownload.test.mjs test/desktopInstaller.test.mjs test/desktopManifest.test.mjs test/desktopPolicy.test.mjs test/desktopRelease.test.mjs
      - name: Typecheck web integration
        run: npm run typecheck
      - name: Build production web application
        run: npm run build

  internal-release:
    if: inputs.channel == 'internal'
    needs: web-gate
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      HEYKASA_DESKTOP_RELEASE_CHANNEL: internal
      HEYKASA_DESKTOP_MINIMUM_VERSION: ${{ inputs.minimum_version }}
      HEYKASA_DESKTOP_RELEASE_NOTES_URL: ${{ inputs.release_notes_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Test native boundary
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Stamp internal release version
        shell: pwsh
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Build internal Windows installer
        run: npm run dist
      - name: Prepare GitHub release bundle
        id: prepare
        run: npm run prepare-github-release
      - uses: actions/upload-artifact@v4
        with:
          name: heykasa-desktop-internal-${{ inputs.version }}
          path: |
            desktop/dist/HayKasa-Setup-*-x64.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
            desktop/dist/release-manifest.json
          if-no-files-found: error
          retention-days: 14

  publish-internal:
    if: inputs.channel == 'internal'
    needs: internal-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heykasa-desktop-internal-${{ inputs.version }}
          path: release
      - name: Resolve internal release tag
        id: meta
        shell: bash
        run: |
          echo "tag=desktop-internal-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          echo "name=HayKasa Desktop Internal ${{ inputs.version }}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            release/HayKasa-Setup-*-x64.exe
            release/latest.yml
            release/*.blockmap
            release/release-manifest.json
      - name: Verify public internal bundle
        shell: bash
        run: |
          set -euo pipefail
          installer="$(basename "$(find release -maxdepth 1 -name 'HayKasa-Setup-*-x64.exe' -print -quit)")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}"
          for asset in latest.yml release-manifest.json "$installer" "$installer.blockmap"; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output /dev/null "$base/$asset"
          done

  signed-release:
    if: inputs.channel != 'internal'
    needs: web-gate
    runs-on: windows-latest
    timeout-minutes: 45
    environment: desktop-release
    defaults:
      run:
        working-directory: desktop
    env:
      CSC_LINK: ${{ secrets.HEYKASA_WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.HEYKASA_WINDOWS_CSC_PASSWORD }}
      HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET: ${{ secrets.HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET }}
      HEYKASA_DESKTOP_RELEASE_CHANNEL: ${{ inputs.channel }}
      HEYKASA_DESKTOP_MINIMUM_VERSION: ${{ inputs.minimum_version }}
      HEYKASA_DESKTOP_RELEASE_NOTES_URL: ${{ inputs.release_notes_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Validate signed release secrets
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { $missing += "HEYKASA_WINDOWS_CSC_LINK" }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { $missing += "HEYKASA_WINDOWS_CSC_PASSWORD" }
          if ([string]::IsNullOrWhiteSpace($env:HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET)) { $missing += "HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET" }
          if ($missing.Count -gt 0) { throw "Missing release secrets: $($missing -join ', ')" }
          if ($env:HEYKASA_DESKTOP_MANIFEST_HMAC_SECRET.Length -lt 32) { throw "Manifest HMAC secret must be at least 32 characters" }
      - name: Install desktop dependencies
        run: npm ci --no-audit --no-fund
      - name: Test native boundary
        run: npm test
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate release version monotonicity
        env:
          HEYKASA_DESKTOP_REQUESTED_VERSION: ${{ inputs.version }}
          HEYKASA_DESKTOP_MINIMUM_VERSION: ${{ inputs.minimum_version }}
        run: node scripts/validate-release-version.mjs
      - name: Stamp signed release version
        shell: pwsh
        run: npm version "${{ inputs.version }}" --no-git-tag-version
      - name: Verify v1 package metadata
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($package.version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') { throw "Invalid desktop version" }
          if ($package.build.appId -ne 'com.heykasa.desktop') { throw "Desktop appId changed unexpectedly" }
          if (-not ($package.build.protocols.schemes -contains 'heykasa')) { throw "heykasa:// protocol is not registered" }
          Write-Host "Preparing HayKasa Desktop $($package.version) on $env:HEYKASA_DESKTOP_RELEASE_CHANNEL"
      - name: Build signed Windows installer
        run: npm run dist
      - name: Verify Authenticode signature
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path dist -Filter 'HayKasa-Setup-*-x64.exe' | Select-Object -First 1
          if (-not $installer) { throw "Signed installer was not produced" }
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature is not valid: $($signature.Status)" }
          if ([string]::IsNullOrWhiteSpace($signature.SignerCertificate.Subject)) { throw "Installer signer identity is missing" }
          Write-Host "Signed by: $($signature.SignerCertificate.Subject)"
      - name: Prepare GitHub release bundle
        id: prepare
        run: npm run prepare-github-release
      - name: Generate runtime SBOM
        shell: pwsh
        run: |
          npm sbom --omit=dev --sbom-format=cyclonedx | Out-File -FilePath dist/heykasa-desktop-sbom.cdx.json -Encoding utf8
          $sbom = Get-Content dist/heykasa-desktop-sbom.cdx.json -Raw | ConvertFrom-Json
          if ($sbom.bomFormat -ne 'CycloneDX') { throw "Desktop SBOM generation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: heykasa-desktop-release-${{ inputs.version }}-${{ inputs.channel }}
          path: |
            desktop/dist/HayKasa-Setup-*-x64.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
            desktop/dist/release-manifest.json
            desktop/dist/heykasa-desktop-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

  publish-signed:
    if: inputs.channel != 'internal'
    needs: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: heykasa-desktop-release-${{ inputs.version }}-${{ inputs.channel }}
          path: release
      - name: Resolve signed release metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ inputs.channel }}" = "stable" ]; then
            echo "tag=desktop-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "name=HayKasa Desktop ${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=desktop-beta-v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "name=HayKasa Desktop Beta ${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ inputs.channel == 'beta' }}
          target_commitish: ${{ github.sha }}
          fail_on_unmatched_files: true
          files: |
            release/HayKasa-Setup-*-x64.exe
            release/latest.yml
            release/*.blockmap
            release/release-manifest.json
            release/heykasa-desktop-sbom.cdx.json
      - name: Verify public GitHub release bundle
        shell: bash
        run: |
          set -euo pipefail
          installer="$(basename "$(find release -maxdepth 1 -name 'HayKasa-Setup-*-x64.exe' -print -quit)")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${{ steps.meta.outputs.tag }}"
          for asset in latest.yml release-manifest.json "$installer" "$installer.blockmap"; do
            curl --fail --location --silent --show-error --retry 5 --retry-delay 2 --output /dev/null "$base/$asset"
          done
      - name: Release summary
        shell: bash
        run: |
          installer="$(basename "$(find release -maxdepth 1 -name 'HayKasa-Setup-*-x64.exe' -print -quit)")"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${{ steps.meta.outputs.tag }}"
          echo "### HayKasa Desktop signed release" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Channel: ${{ inputs.channel }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source ref: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: $base" >> "$GITHUB_STEP_SUMMARY"
          echo "- Installer: $installer" >> "$GITHUB_STEP_SUMMARY"
