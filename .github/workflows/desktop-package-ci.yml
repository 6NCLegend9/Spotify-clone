name: Desktop Package CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - "contracts/**"
      - "scripts/generate-desktop-contract.mjs"
      - "scripts/desktop-dev*.mjs"
      - "src/generated/desktopContract.mjs"
      - "src/app/api/desktop/**"
      - "src/utils/desktop*.mjs"
      - ".github/workflows/desktop-package-ci.yml"
      - ".github/workflows/desktop-release.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "contracts/**"
      - "scripts/generate-desktop-contract.mjs"
      - "scripts/desktop-dev*.mjs"
      - "src/generated/desktopContract.mjs"
      - "src/app/api/desktop/**"
      - "src/utils/desktop*.mjs"
      - ".github/workflows/desktop-package-ci.yml"
      - ".github/workflows/desktop-release.yml"

permissions:
  contents: read

concurrency:
  group: desktop-package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    strategy:
      fail-fast: false
      matrix:
        baseline: [internal, historical]
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      HEYKASA_DESKTOP_RELEASE_CHANNEL: internal
      HEYKASA_DESKTOP_MINIMUM_VERSION: "1.0.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
      - name: Validate canonical desktop contract
        run: npm run check:desktop-contract
      - name: Install desktop dependencies
        run: npm --prefix desktop ci --no-audit --no-fund
      - name: Audit shipped runtime and build dependencies
        run: npm --prefix desktop audit --include=dev --audit-level=moderate
      - name: Verify actual packaging include and exclude behavior
        run: node --test desktop/scripts/check-packaging-filters.mjs
      - name: Stamp internal preview channel
        run: npm --prefix desktop pkg set heykasaReleaseChannel=internal
      - name: Build isolated upgrade baseline
        if: matrix.baseline == 'internal'
        shell: pwsh
        run: |
          $baseVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version.Split('-')[0]
          Push-Location desktop
          try {
            ./node_modules/.bin/electron-builder.cmd --win nsis --x64 --publish never --config.directories.output=../artifacts/desktop-upgrade-baseline "--config.extraMetadata.version=$baseVersion-internal.0"
            if ($LASTEXITCODE -ne 0) { throw "Could not build the internal upgrade baseline" }
          } finally { Pop-Location }
      - name: Fetch pinned published upgrade baseline
        if: matrix.baseline == 'historical'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/desktop-upgrade-baseline | Out-Null
          $installer = 'artifacts/desktop-upgrade-baseline/HayKasa-Setup-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/6NCLegend9/Spotify-clone/releases/download/desktop-latest/HayKasa-Setup-x64.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '5f163cdf097b30ecc5a83e48602ed301890f8df66f04751dae034f90e7c9f36b') {
            throw 'Published baseline changed; inspect the replacement before updating its digest.'
          }
      - name: Stamp internal test version
        shell: pwsh
        run: |
          $baseVersion = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version.Split('-')[0]
          npm --prefix desktop version "$baseVersion-internal.${{ github.run_number }}" --no-git-tag-version
          if ($LASTEXITCODE -ne 0) { throw "Could not stamp the internal test version" }
      - name: Build unsigned Windows installer
        run: npm --prefix desktop run dist
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path desktop/dist -Filter "HayKasa-Setup-*-x64.exe" | Select-Object -First 1
          if (-not $installer) { throw "HayKasa-Setup installer was not produced" }
          $exe = Get-ChildItem -Path desktop/dist -Recurse -Filter "HayKasa.exe" | Select-Object -First 1
          if (-not $exe) { throw "HayKasa.exe was not produced" }
          Write-Host "Installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB)"
          ./desktop/scripts/check-windows-icons.ps1 -ExecutablePaths @($exe.FullName, $installer.FullName)
      - name: Generate and verify shipped Electron SBOM
        shell: pwsh
        run: |
          npm --prefix desktop sbom --omit=dev --sbom-format=cyclonedx | Out-File -FilePath desktop/dist/heykasa-desktop-sbom.cdx.json -Encoding utf8
          if ($LASTEXITCODE -ne 0) { throw "Desktop SBOM generation failed" }
          node desktop/scripts/include-electron-in-sbom.mjs desktop/dist/heykasa-desktop-sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "Desktop runtime missing from SBOM" }
          node --test desktop/scripts/check-runtime-sbom.mjs
          if ($LASTEXITCODE -ne 0) { throw "Desktop SBOM checks failed" }
      - name: Validate GitHub release bundle preparation
        run: npm --prefix desktop run prepare-github-release
      - name: Verify installed upgrade and retained profile
        shell: pwsh
        env:
          UPGRADE_BASELINE: ${{ matrix.baseline }}
        run: |
          $before = @(Get-ChildItem artifacts/desktop-upgrade-baseline -Filter 'HayKasa-Setup*.exe')
          $after = @(Get-ChildItem desktop/dist -Filter 'HayKasa-Setup-*-x64.exe')
          if ($before.Count -ne 1 -or $after.Count -ne 1) { throw "Expected exactly one baseline and one replacement installer" }
          ./desktop/scripts/check-installed-upgrade.ps1 -BeforeInstaller $before[0].FullName -AfterInstaller $after[0].FullName -HistoricalBaseline:($env:UPGRADE_BASELINE -eq 'historical')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-installed-upgrade-${{ matrix.baseline }}-${{ github.sha }}
          path: artifacts/installed-upgrade/
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: matrix.baseline == 'internal'
        with:
          name: heykasa-desktop-windows-${{ github.sha }}
          path: |
            desktop/dist/HayKasa-Setup-*-x64.exe
            desktop/dist/latest.yml
            desktop/dist/*.blockmap
            desktop/dist/release-manifest.json
            desktop/dist/heykasa-desktop-sbom.cdx.json
            desktop/dist/icon-verification/
          if-no-files-found: error
          retention-days: 7
