plugins { id 'com.android.application' }

def releaseSigningEnvironment = [
    HAYKASA_ANDROID_KEYSTORE_PATH: System.getenv('HAYKASA_ANDROID_KEYSTORE_PATH'),
    HAYKASA_ANDROID_KEYSTORE_PASSWORD: System.getenv('HAYKASA_ANDROID_KEYSTORE_PASSWORD'),
    HAYKASA_ANDROID_KEY_ALIAS: System.getenv('HAYKASA_ANDROID_KEY_ALIAS'),
    HAYKASA_ANDROID_KEY_PASSWORD: System.getenv('HAYKASA_ANDROID_KEY_PASSWORD')
]
def requireReleaseSigning = System.getenv('HAYKASA_ANDROID_REQUIRE_SIGNING') == '1'
def anyReleaseSigningProvided = releaseSigningEnvironment.values().any { it != null }
def missingReleaseSigning = releaseSigningEnvironment.findAll { name, value -> value == null || value.isEmpty() }.keySet()
def configureReleaseSigning = missingReleaseSigning.isEmpty()
def releaseKeystore = null

if (requireReleaseSigning || anyReleaseSigningProvided) {
    if (!configureReleaseSigning) {
        throw new GradleException("Missing Android release signing environment variables: ${missingReleaseSigning.join(', ')}.")
    }
    releaseKeystore = file(releaseSigningEnvironment.HAYKASA_ANDROID_KEYSTORE_PATH)
    if (!releaseKeystore.isFile() || !releaseKeystore.canRead()) {
        throw new GradleException('HAYKASA_ANDROID_KEYSTORE_PATH must point to a readable keystore file.')
    }
}

android {
    namespace 'app.haykasa.android'
    compileSdk 36
    buildToolsVersion "36.0.0"
    defaultConfig {
        applicationId 'app.haykasa.android'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    sourceSets { androidTest.assets.srcDirs += "build/generated/qaAssets" }
    signingConfigs {
        if (configureReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword releaseSigningEnvironment.HAYKASA_ANDROID_KEYSTORE_PASSWORD
                keyAlias releaseSigningEnvironment.HAYKASA_ANDROID_KEY_ALIAS
                keyPassword releaseSigningEnvironment.HAYKASA_ANDROID_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release {
            minifyEnabled false
            if (configureReleaseSigning) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Keep Java functional APIs available on the existing Android 6 minimum.
        coreLibraryDesugaringEnabled true
    }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
