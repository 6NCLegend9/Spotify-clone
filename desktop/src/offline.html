<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://haykasa.vercel.app" />
    <title>HeyKasa Desktop</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #07111f; color: #f8fbff; }
      main { width: min(92vw, 520px); padding: 32px; border: 1px solid rgba(255,255,255,.1); border-radius: 18px; background: rgba(13,28,45,.92); box-shadow: 0 24px 80px rgba(0,0,0,.35); }
      .eyebrow { color: #00e6e6; font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 10px 0 12px; font-size: clamp(28px, 6vw, 42px); }
      p { margin: 0; color: #9aa8b5; line-height: 1.6; }
      button { margin-top: 24px; min-height: 44px; border: 0; border-radius: 999px; padding: 0 20px; background: #00e6e6; color: #041017; font-weight: 800; cursor: pointer; }
      button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">HeyKasa Desktop</div>
      <h1>HeyKasa is offline.</h1>
      <p>The desktop shell is running, but the HeyKasa web app could not be reached. Your local desktop settings are safe. Check your connection and try again.</p>
      <button id="retry" type="button">Retry</button>
    </main>
    <script>
      const target = "https://haykasa.vercel.app";
      const retry = () => { window.location.href = target; };
      document.getElementById("retry").addEventListener("click", retry);
      window.addEventListener("online", () => window.setTimeout(retry, 500));
    </script>
  </body>
</html>
